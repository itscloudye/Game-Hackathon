<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>r/DailySpot — Reddit Mini-Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0px !important;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-page: #FFFFFF;
      --bg-subtle: #F6F7F8;
      --border-light: #EDEFF1;
      --border-strong: #1A1A1B;
      --text-main: #1A1A1B;
      --text-muted: #787C7E;
      --reddit-orange: #FF4500;
      --reddit-blue: #0079D3;
      --reddit-green: #46D160;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "IBM Plex Sans", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 16px;
      line-height: 1.4;
    }

    .reddit-post-container {
      width: 100%;
      max-width: 680px;
      background: var(--bg-page);
      border: 1px solid var(--border-strong);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-light);
      font-size: 12px;
    }

    .subreddit-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sub-icon {
      width: 20px;
      height: 20px;
      background: var(--reddit-orange);
      color: #FFFFFF;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    .sub-name {
      font-weight: 700;
      color: var(--text-main);
    }

    .post-meta {
      color: var(--text-muted);
    }

    .streak-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .streak-badge {
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      padding: 3px 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .streak-fire {
      color: var(--reddit-orange);
    }

    .post-title-area {
      padding: 12px 14px 8px 14px;
    }

    .flair-tag {
      display: inline-block;
      background: var(--bg-subtle);
      border: 1px solid #CCC;
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .post-title {
      display: inline;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      vertical-align: middle;
    }

    .post-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .checklist-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--border-strong);
      border-bottom: 1px solid var(--border-strong);
      background: var(--bg-subtle);
    }

    .target-item {
      padding: 8px 6px;
      text-align: center;
      border-right: 1px solid var(--border-light);
      font-size: 12px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      user-select: none;
    }

    .target-item:last-child {
      border-right: none;
    }

    .target-item.found {
      background: #FFFFFF;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .target-item.found .target-status {
      color: var(--reddit-orange);
      font-weight: 700;
      text-decoration: none;
    }

    .target-status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      background: #FFFFFF;
      cursor: crosshair;
      overflow: hidden;
    }

    svg#gameScene {
      display: block;
      width: 100%;
      height: auto;
      background: #FFFFFF;
    }

    .found-marker {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 2px solid var(--reddit-orange);
      background: rgba(255, 69, 0, 0.08);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: popIn 0.15s ease-out;
    }

    .miss-marker {
      position: absolute;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: fadeUp 0.5s forwards;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(1.4); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes fadeUp {
      0% { opacity: 1; transform: translate(-50%, -50%); }
      100% { opacity: 0; transform: translate(-50%, -140%); }
    }

    .win-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.96);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      border-top: 1px solid var(--border-light);
    }

    .win-overlay.active {
      display: flex;
    }

    .win-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .win-stats {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .share-preview {
      width: 100%;
      max-width: 340px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      padding: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      text-align: left;
      margin-bottom: 14px;
      white-space: pre-line;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .reddit-btn {
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: #FFFFFF;
      color: var(--text-main);
    }

    .reddit-btn:hover {
      background: var(--bg-subtle);
    }

    .reddit-btn.primary {
      background: var(--reddit-orange);
      color: #FFFFFF;
      border-color: var(--reddit-orange);
    }

    .reddit-btn.primary:hover {
      background: #E03D00;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-top: 1px solid var(--border-strong);
      background: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }
